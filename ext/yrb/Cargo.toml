[package]
name = "yrb"
version = "0.6.0"
authors = ["Hannes Moser <box@hannesmoser.at>"]
edition = "2021"
homepage = "https://github.com/y-crdt/yrb"
repository = "https://github.com/y-crdt/yrb"

[dependencies]
magnus = "0.6.4"
thiserror = "1.0"
yrs = "0.16.10"
y-sync = "0.3.1"
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }

[dev-dependencies]
magnus = { version = "0.6.4", features = ["embed"] }

[lib]
name = "yrb"
crate-type = ["cdylib"]
